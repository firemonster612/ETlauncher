name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting (Biome)
        run: bun run format:check

      - name: Lint (ESLint)
        run: bun run lint

      - name: Type check (svelte-check-rs)
        run: bun run check

  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting (rustfmt)
        working-directory: src-tauri
        run: cargo fmt-check

      - name: Check compilation
        working-directory: src-tauri
        run: cargo check --all-targets --all-features

      - name: Lint (Clippy)
        working-directory: src-tauri
        run: cargo lint

  tauri-version-check:
    name: Tauri Version Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check Tauri plugin version sync
        run: |
          echo "Checking Tauri plugin version sync between Rust and JS..."
          echo ""

          mismatches=""
          for plugin in $(grep -oP '(?<=name = "tauri-plugin-)[a-z-]+(?=")' src-tauri/Cargo.lock | sort -u); do
            rust_ver=$(grep -A1 "name = \"tauri-plugin-$plugin\"" src-tauri/Cargo.lock | grep -oP '(?<=version = ")[0-9]+\.[0-9]+' | head -1)
            js_ver=$(grep -oP "@tauri-apps/plugin-$plugin@\K[0-9]+\.[0-9]+" bun.lock | head -1)

            if [ -n "$rust_ver" ] && [ -n "$js_ver" ]; then
              echo "tauri-plugin-$plugin: Rust=$rust_ver, JS=$js_ver"
              if [ "$rust_ver" != "$js_ver" ]; then
                mismatches="${mismatches}  tauri-plugin-$plugin (Rust: $rust_ver) != @tauri-apps/plugin-$plugin (JS: $js_ver)\n"
              fi
            fi
          done

          echo ""
          if [ -n "$mismatches" ]; then
            echo "::error::Tauri plugin version mismatch detected!"
            echo -e "$mismatches"
            echo "Fix: Update JS packages to match Rust crate versions (major.minor must match)"
            exit 1
          fi

          echo "All Tauri plugin versions are in sync!"

  build:
    name: Build (${{ matrix.platform }})
    needs: [frontend-checks, rust-checks, tauri-version-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
