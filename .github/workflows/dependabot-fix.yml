name: Dependabot Auto-fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Regenerate bun.lock if needed
        run: |
          bun install --no-frozen-lockfile
          if [[ -n $(git status --porcelain bun.lock) ]]; then
            echo "LOCKFILE_CHANGED=true" >> $GITHUB_ENV
          fi

      - name: Format Rust code
        working-directory: src-tauri
        run: |
          cargo fmt
          if [[ -n $(git status --porcelain) ]]; then
            echo "RUST_FORMATTED=true" >> $GITHUB_ENV
          fi

      - name: Commit fixes via GitHub API
        if: env.LOCKFILE_CHANGED == 'true' || env.RUST_FORMATTED == 'true'
        uses: planetscale/ghcommit-action@v0.2.20
        with:
          commit_message: "chore: auto-fix lockfile and formatting"
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
