[package]
name = "etlauncher"
version = "0.1.2"
description = "An Alien's Minecraft Launcher"
authors = ["firemonster612"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "etlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.6"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = [
  "json",
  "rustls-tls",
  "multipart",
  "stream",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Secure credential storage
# Platform backends: macOS Keychain, Windows Credential Manager, Linux Secret Service
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# Hashing for file verification
sha1 = "0.10"
sha2 = "0.11"
md5 = "0.8"

# Async utilities
futures = "0.3"
tokio-util = "0.7"

# ZIP extraction for natives
zip = "8"

# TAR.GZ extraction for Java downloads
flate2 = "1"
tar = "0.4"

# Cross-platform directory paths
dirs = "6"

# Thread-safe state
parking_lot = "0.12"

# URL encoding
urlencoding = "2"

# Parallel processing
rayon = "1.10"

# Murmur2 hashing for CurseForge fingerprinting
murmur2 = "0.1"

# Random number generation
rand = "0.10"

# Base64 encoding
base64 = "0.22"

# NBT parsing
quartz_nbt = { version = "0.2", features = ["serde"] }

# Regex for HTML parsing
regex = "1"

# Exponential backoff for retry logic
backoff = { version = "0.4", features = ["tokio"] }

# Local HTTP server for Yggdrasil
axum = "0.8"

# RSA signing for Yggdrasil texture properties
rsa = { version = "0.9", features = ["sha1", "pkcs5"] }

# Directory traversal
walkdir = "2"
tauri-plugin-clipboard-manager = "2.3.2"

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
] }

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9"
